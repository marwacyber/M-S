<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030A18">
<meta name="robots" content="noindex, nofollow">
<title>MR//S — Private Transmission</title>
<style>
/* =====================================================
   TOKENS
   ===================================================== */
:root{
  --deep:#071A3D; --navy:#030A18; --e:#176BFF; --b:#2F8CFF; --w:#F5F8FF; --sb:#B9C9E8; --cy:#39C6FF;
  --fg:var(--w); --dim:var(--sb); --line:rgba(47,140,255,.28); --lab:var(--b);
  --glass:rgba(7,26,61,.55);
  --sans:"Inter","Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.8,.22,1);
}
body[data-th=glow]{--fg:#071A3D;--dim:rgba(7,26,61,.68);--line:rgba(7,26,61,.22);--lab:#176BFF}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;background:var(--navy);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--sans);color:var(--fg);height:100dvh;-webkit-font-smoothing:antialiased;transition:color 1.6s ease}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px;border-radius:4px}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
textarea{user-select:text;-webkit-user-select:text}

/* ---------- background layers ---------- */
.bg{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease}
#bg-a{background:radial-gradient(120% 80% at 50% 8%,#0b2a66 0%,#071A3D 38%,#030A18 100%)}
#bg-b{background:radial-gradient(100% 70% at 50% 50%,#050e22 0%,#010409 80%)}
#bg-c{background:radial-gradient(90% 70% at 50% 35%,#F5F8FF 0%,#d6e4ff 42%,#9ec2ff 100%)}
#bg-d{background:radial-gradient(110% 80% at 50% 50%,#061431 0%,#030A18 85%)}
#bg-e{background:radial-gradient(70% 55% at 50% 40%,#071A3D 0%,#030A18 60%,#010309 100%)}
body[data-bg=a] #bg-a,body[data-bg=b] #bg-b,body[data-bg=c] #bg-c,body[data-bg=d] #bg-d,body[data-bg=e] #bg-e{opacity:1}

#grid{position:absolute;inset:0;pointer-events:none;opacity:.55;transition:opacity 1.6s;
  background-image:linear-gradient(rgba(47,140,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,140,255,.07) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(90% 70% at 50% 45%,#000 20%,transparent 100%);mask-image:radial-gradient(90% 70% at 50% 45%,#000 20%,transparent 100%)}
body[data-th=glow] #grid{opacity:.35;background-image:linear-gradient(rgba(7,26,61,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(7,26,61,.07) 1px,transparent 1px)}
body[data-th=final] #grid,body[data-th=black] #grid{opacity:.18}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#grain{position:absolute;inset:-50%;pointer-events:none;opacity:.05;z-index:4;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.3s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* ---------- orb ---------- */
#orb{position:absolute;left:50%;top:43%;width:min(80vw,360px);aspect-ratio:1;z-index:5;pointer-events:none;
  transform:translate(-50%,-50%) scale(var(--os,1));opacity:var(--oo,0);transition:transform 2.2s var(--ease),opacity 1.8s ease;
  filter:drop-shadow(0 0 26px rgba(23,107,255,.55))}
body[data-orb=hub]{--os:1;--oo:1}
body[data-orb=bg]{--os:2.7;--oo:.1}
body[data-orb=off]{--os:2.7;--oo:0}
#orb g{transform-box:view-box;transform-origin:50% 50%}
.r1{animation:spin 70s linear infinite}.r2{animation:spin 44s linear infinite reverse}.r3{animation:spin 26s linear infinite}.r4{animation:spin 16s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.core{animation:breathe 4.5s ease-in-out infinite;transform-box:view-box;transform-origin:50% 50%}
@keyframes breathe{50%{transform:scale(1.14)}}
#hubtext{position:absolute;left:0;right:0;top:calc(43% + min(44vw,190px));text-align:center;z-index:6;font:500 11.5px var(--mono);letter-spacing:.26em;color:var(--dim);
  opacity:0;transform:translateY(8px);transition:opacity 1.6s,transform 1.6s var(--ease);padding:0 16px}
body[data-orb=hub] #hubtext{opacity:1;transform:none;transition-delay:.8s}
#fxlayer{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 14px) 22px 0;opacity:0;transition:opacity 1.4s;pointer-events:none}
body.started #hud,body.started #bar{opacity:1}
#hud>*{max-width:600px;margin-left:auto;margin-right:auto}
.hrow{display:flex;justify-content:space-between;font:600 11px var(--mono);letter-spacing:.3em;color:var(--dim)}
#seg{display:flex;gap:4px;margin-top:11px}
#seg i{flex:1;height:2px;background:var(--line);position:relative;overflow:hidden;border-radius:2px}
#seg i::after{content:"";position:absolute;inset:0;background:var(--b);transform:scaleX(var(--f,0));transform-origin:left;transition:transform 1.6s var(--ease);box-shadow:0 0 8px var(--b)}
body[data-th=glow] #seg i::after{background:var(--e);box-shadow:none}
#coord{margin-top:8px;font:400 9.5px var(--mono);letter-spacing:.2em;color:var(--dim);opacity:.7}

#bar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 22px calc(env(safe-area-inset-bottom) + 14px);opacity:0;transition:opacity 1.4s;pointer-events:none}
#bar>*{max-width:600px;margin-left:auto;margin-right:auto}
#hint{pointer-events:auto;display:block;margin:0 auto 12px;min-height:46px;padding:0 22px;border:1px solid var(--line);border-radius:2px;font:500 11px var(--mono);letter-spacing:.2em;color:var(--fg);
  background:rgba(23,107,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transform:translateY(10px);visibility:hidden;transition:opacity 1s var(--ease),transform 1s var(--ease),visibility 0s 1s;position:relative}
#hint.show{opacity:1;transform:none;visibility:visible;transition-delay:0s}
#hint::before,#hint::after{content:"";position:absolute;width:8px;height:8px;border:1.5px solid var(--b)}
#hint::before{left:-1px;top:-1px;border-right:0;border-bottom:0}#hint::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
#hint.pulse{animation:hp 2.6s ease-in-out infinite}
@keyframes hp{50%{box-shadow:0 0 22px rgba(47,140,255,.45)}}
.brow{display:flex;justify-content:space-between;align-items:center;font:500 11px var(--mono);letter-spacing:.22em;color:var(--dim)}
.sig{pointer-events:auto;font:500 11px var(--mono);letter-spacing:.22em;color:var(--dim);padding:10px 0 10px 18px;opacity:.85}

/* ---------- song link ---------- */
#music{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 66px);z-index:30;display:none;align-items:flex-start;gap:8px;flex-direction:row-reverse}
body.started #music{display:flex}
#mbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);font-size:16px;display:grid;place-items:center}
body[data-th=glow] #mbtn,body[data-th=glow] #mpanel{background:rgba(255,255,255,.7)}
#mpanel{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  opacity:0;transform:translateX(10px);pointer-events:none;transition:opacity .4s,transform .5s var(--ease);max-width:min(68vw,250px)}
#mpanel small{font:500 9.5px var(--mono);letter-spacing:.3em;color:var(--lab)}
#mpanel span{font:500 13px/1.35 var(--sans);color:var(--fg)}
#mpanel a{display:flex;align-items:center;min-height:38px;font:500 11px var(--mono);letter-spacing:.18em;color:var(--b);text-decoration:none}
body[data-th=glow] #mpanel a{color:var(--e)}
#music.open #mpanel{opacity:1;transform:none;pointer-events:auto}
#mpanel{max-width:min(74vw,270px)}
#mbtn{position:relative}
#mbtn .eq{position:absolute;bottom:5px;display:flex;gap:2px;align-items:flex-end;height:7px;opacity:0;transition:opacity .4s}
#music.playing #mbtn .eq{opacity:1}
#mbtn .eq b{width:2px;background:var(--b);height:30%;animation:eq 1s ease-in-out infinite}
#mbtn .eq b:nth-child(2){animation-delay:.25s}#mbtn .eq b:nth-child(3){animation-delay:.5s}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
#ytwrap{width:240px;max-width:100%;aspect-ratio:16/9;margin:6px 0 2px;border:1px solid var(--line);background:#000;position:relative;overflow:hidden}
#ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mctl{display:flex;align-items:center;gap:12px;font:500 10.5px var(--mono);letter-spacing:.14em}
#mctl button{min-height:36px;padding:0 2px;color:var(--fg);letter-spacing:.14em}
#mvol{flex:1;min-width:60px;accent-color:var(--b);height:24px}
#music.linkonly #ytwrap,#music.linkonly #mctl{display:none}

/* =====================================================
   OPENING
   ===================================================== */
#opening{position:absolute;inset:0;z-index:35;background:var(--navy);display:flex;flex-direction:column;justify-content:center;padding:0 28px;transition:opacity 1.2s ease,filter 1.2s;overflow:hidden}
#opening.out{opacity:0;filter:blur(10px);pointer-events:none}
#opening .wrap{width:100%;max-width:520px;margin:0 auto;position:relative}
#bootline{height:1px;width:0;background:linear-gradient(90deg,transparent,var(--b) 20%,var(--b) 80%,transparent);box-shadow:0 0 14px var(--b);transition:width 2.6s var(--ease);margin-bottom:26px;margin-left:-28px}
#bootline.go{width:calc(100% + 56px)}
.sys{font:500 12px var(--mono);letter-spacing:.26em;color:var(--b);margin:7px 0;opacity:0;transform:translateX(-6px);transition:opacity .7s,transform .7s var(--ease)}
.sys.in{opacity:1;transform:none}
#opening.dim .sys{opacity:.35}
.ol{opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 1.6s var(--ease),filter 1.6s var(--ease),transform 1.6s var(--ease)}
.ol.in{opacity:1;filter:blur(0);transform:none}
#o-name{font:700 clamp(46px,15vw,76px) var(--disp);letter-spacing:-.03em;margin-top:34px;line-height:1}
#o-made{font:500 clamp(20px,5.8vw,26px) var(--sans);color:var(--dim);margin-top:12px}
#o-q{font:500 12px var(--mono);letter-spacing:.28em;color:var(--b);margin-top:36px;min-height:1.4em}
#o-btns{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}
.btn{position:relative;min-height:52px;padding:0 24px;border:1px solid var(--line);font:600 13px var(--mono);letter-spacing:.2em;color:var(--w);background:rgba(23,107,255,.12);transition:background .3s,box-shadow .3s,scale .15s}
.btn::before,.btn::after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid var(--b)}
.btn::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.btn::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.btn:hover,.btn:active{background:rgba(23,107,255,.3);box-shadow:0 0 26px rgba(47,140,255,.4)}
.btn:active{scale:.97}
.btn.primary{background:linear-gradient(135deg,#176BFF,#2F8CFF);border-color:transparent}
.btn.primary::before,.btn.primary::after{border-color:#F5F8FF}

/* =====================================================
   STAGE / FLOW
   ===================================================== */
#stage{position:absolute;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;transition:opacity .5s ease,filter .5s ease}
#stage::-webkit-scrollbar{display:none}
#stage.out{opacity:0;filter:blur(8px)}
#flow{min-height:100%;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 104px) 28px calc(env(safe-area-inset-bottom) + 150px)}
#flow.text>:first-child{margin-top:auto}
#flow.text>:last-child{margin-bottom:auto}
#flow.center{text-align:center;align-items:center}
.ln{opacity:0;filter:blur(10px);transform:translateY(14px);transition:opacity 1.5s var(--ease),filter 1.5s var(--ease),transform 1.5s var(--ease),color 1s;margin:12px 0}
.ln.in{opacity:1;filter:blur(0);transform:none}
.ln.in.now{transition-duration:.25s}
.ln.past{opacity:.48}
.ln.big{font:700 clamp(30px,8.6vw,48px)/1.08 var(--disp);letter-spacing:-.02em}
.ln.huge{font:700 clamp(58px,19vw,104px)/.95 var(--disp);letter-spacing:-.035em}
.ln.mid{font:500 clamp(20px,5.9vw,27px)/1.3 var(--sans);letter-spacing:-.005em}
.ln.sm{font:400 clamp(16px,4.6vw,20px)/1.4 var(--sans);color:var(--dim)}
.ln.mono{font:500 11.5px/1.5 var(--mono);letter-spacing:.24em;color:var(--lab);margin:5px 0;text-transform:uppercase}
.ln.accent{color:var(--b)}
body[data-th=glow] .ln.accent{color:var(--e)}
.gap{height:22px;flex:none}
.hline{height:1px;width:100%;background:linear-gradient(90deg,var(--b),transparent);box-shadow:0 0 12px rgba(47,140,255,.6);margin:6px 0 22px;transform:scaleX(0);transform-origin:left;transition:transform 2.2s var(--ease)}
.hline.in{transform:scaleX(1)}
#flow.center .hline{background:linear-gradient(90deg,transparent,var(--b),transparent)}

/* vertical typography reveal (transmission 02) */
#flow.vert .ln{transition:none;opacity:0;filter:none;transform:none}
#flow.vert .ln.in{opacity:1;animation:vrev 1.3s var(--ease) both}
@keyframes vrev{from{clip-path:inset(0 0 100% 0);transform:translateY(46%)}to{clip-path:inset(-10% -5% -10% -5%);transform:none}}
#flow.vert .ln.past{opacity:.48}

/* enter animations (different per chapter) */
body[data-enter=center] #flow{animation:cReveal 1.9s var(--ease) both}
@keyframes cReveal{from{clip-path:circle(0% at 50% 50%);opacity:0}to{clip-path:circle(150% at 50% 50%);opacity:1}}
body[data-enter=glow] #flow{animation:gZoom 3s ease-out both}
@keyframes gZoom{from{transform:scale(1.1);opacity:0;filter:blur(10px)}to{transform:none;opacity:1;filter:none}}
body[data-enter=tech] #flow{animation:tIn 1.1s var(--ease) both}
@keyframes tIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
body[data-enter=expand] #flow{animation:xIn 1.3s var(--ease) both}
@keyframes xIn{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:none}}
body[data-enter=scan] #flow{animation:sIn 1.4s ease both}
@keyframes sIn{from{opacity:0}to{opacity:1}}
.scanh{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--b) 25%,#F5F8FF 50%,var(--b) 75%,transparent);box-shadow:0 0 22px 2px rgba(47,140,255,.7);animation:scanY 1.5s ease-in-out forwards}
@keyframes scanY{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}
.scanx{position:absolute;top:0;bottom:0;left:0;width:2px;background:linear-gradient(180deg,transparent,var(--b) 25%,#F5F8FF 50%,var(--b) 75%,transparent);box-shadow:0 0 22px 2px rgba(47,140,255,.7);animation:scanX 1.8s ease-in-out forwards}
@keyframes scanX{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}

/* floating labels (transmission 02) */
.flabel{position:absolute;font:500 11px var(--mono);letter-spacing:.3em;color:var(--b);opacity:0;transition:opacity 1.4s ease;display:flex;align-items:center;gap:8px}
.flabel.in{opacity:.9;animation:fl 7s ease-in-out infinite}
.flabel::before{content:"+";font-size:14px;color:var(--cy)}
@keyframes fl{50%{transform:translateY(-8px)}}

/* split-screen (transmission 03) */
.split{display:grid;grid-template-columns:1fr 1px 1fr;gap:18px;align-items:stretch;margin:14px 0 22px;width:100%}
.sc{display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(12px);filter:blur(6px);transition:all 1.4s var(--ease)}
.sc.in{opacity:1;transform:none;filter:none}
.sc small{font:500 10.5px/1.5 var(--mono);letter-spacing:.2em;color:var(--dim)}
.sc b{font:700 clamp(28px,8vw,42px)/1 var(--disp);letter-spacing:-.02em}
.sc.l b{color:var(--dim);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(185,201,232,.45)}
.sc.r small{color:var(--b)}
.sc.r b{text-shadow:0 0 24px rgba(47,140,255,.7)}
.vl{background:linear-gradient(180deg,transparent,var(--b),transparent);transform:scaleY(0);transition:transform 1.4s var(--ease);position:relative}
.vl.in{transform:scaleY(1)}
.vl::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--b);box-shadow:0 0 14px var(--b)}

/* progress (transmission 05) */
.prog{width:100%;margin:10px 0 28px;opacity:0;transition:opacity 1s}
.prog.in{opacity:1}
.prog .bar2{height:3px;background:var(--line);margin:14px 0 10px;position:relative;border-radius:2px;overflow:visible}
.prog .bar2 i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--e),var(--b));box-shadow:0 0 14px var(--b);border-radius:2px}
.prog .bar2 i::after{content:"";position:absolute;right:-4px;top:-3px;width:9px;height:9px;border-radius:50%;background:var(--w);box-shadow:0 0 12px var(--b)}
.prog .pct{font:600 22px var(--mono);letter-spacing:.1em;color:var(--fg)}

/* final point */
.pointwrap{align-self:center;padding:34px;margin-bottom:6px;pointer-events:auto}
.point{display:block;width:12px;height:12px;border-radius:50%;background:var(--b);box-shadow:0 0 18px 4px rgba(47,140,255,.8),0 0 70px 18px rgba(23,107,255,.45);animation:pt 3.4s ease-in-out infinite;position:relative;-webkit-touch-callout:none}
.point::before{content:"";position:absolute;inset:44px -44px -44px -44px}
@keyframes pt{50%{box-shadow:0 0 26px 6px rgba(47,140,255,1),0 0 100px 26px rgba(23,107,255,.55);transform:scale(1.25)}}

/* =====================================================
   REPLY PANEL
   ===================================================== */
.panel{width:100%;margin:22px 0 10px;padding:18px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;opacity:0;transform:scale(.94);transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
.panel.in{opacity:1;transform:none}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--b)}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.prow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 10.5px var(--mono);letter-spacing:.2em;color:var(--dim);margin-bottom:12px}
.prow span:last-child{color:var(--b)}
.cur{display:inline-block;width:7px;height:12px;margin-left:5px;background:var(--b);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tawrap{position:relative}
#ta{display:block;width:100%;min-height:150px;max-height:48vh;resize:vertical;padding:16px;border:1px solid var(--line);background:rgba(3,10,24,.7);color:var(--w);font:400 16.5px/1.5 var(--sans);caret-color:var(--b);outline:none;border-radius:0;
  transition:border-color .4s,box-shadow .5s,background .5s}
#ta::placeholder{color:rgba(185,201,232,.5)}
#ta:focus{border-color:var(--b);box-shadow:0 0 0 1px var(--b),0 0 34px rgba(47,140,255,.4);background:rgba(3,10,24,.88)}
.crow{display:flex;justify-content:space-between;gap:12px;margin:8px 0 16px;font:500 10.5px var(--mono);letter-spacing:.16em;color:var(--dim);min-height:18px}
#warn{color:var(--cy);letter-spacing:.04em;font-family:var(--sans);font-size:14px}
.panel .btn{display:block;width:100%}
.panel .btn+.btn{margin-top:12px}
#send{min-height:60px;font-size:14px}
#idk{font-family:var(--sans);font-weight:500;letter-spacing:.02em;font-size:15px;min-height:48px;background:transparent}
#songlink{display:none;margin-top:14px;text-align:center;font:500 11px var(--mono);letter-spacing:.24em;color:var(--b);text-decoration:none;padding:10px}
#songlink.show{display:block}
#note{margin-top:12px;font:400 14px var(--sans);color:var(--dim);min-height:20px;text-align:center}
#note a{color:var(--b)}
#tip{margin-top:22px;text-align:center;opacity:0;transition:opacity 1.6s}
#tip.in{opacity:1}
#tip small{display:block;font:500 10px var(--mono);letter-spacing:.3em;color:var(--lab);margin-bottom:6px}
#tip span{font:500 15px var(--sans);color:var(--dim)}

/* =====================================================
   POP (secrets)
   ===================================================== */
#pop{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:50;max-width:420px;margin:0 auto;padding:16px 18px;border:1px solid var(--b);background:rgba(3,10,24,.92);color:var(--w);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(23,107,255,.45);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .6s,transform .6s var(--ease);font:500 16px/1.4 var(--sans)}
#pop.show{opacity:1;transform:none;pointer-events:auto}
#pop small{display:block;font:500 10px var(--mono);letter-spacing:.3em;color:var(--b);margin-bottom:8px}
#pop p+p{margin-top:6px;color:var(--sb)}

/* photo frames (memory imagery, used sparingly) */
.pframe{align-self:center;width:min(46vw,180px);margin:10px 0 14px;position:relative;opacity:0;transform:translateY(12px) scale(.97);filter:blur(6px);transition:all 1.6s var(--ease)}
.pframe.in{opacity:1;transform:none;filter:none}
.pframe .img{aspect-ratio:3/4;background-size:cover;background-position:var(--pos,50% 25%);border:1px solid var(--line);position:relative;overflow:hidden}
.pframe .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(3,10,24,.55)),repeating-linear-gradient(0deg,rgba(47,140,255,.06) 0 1px,transparent 1px 3px)}
.pframe::before,.pframe::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--b);z-index:2}
.pframe::before{left:-6px;top:-6px;border-right:0;border-bottom:0}.pframe::after{right:-6px;bottom:30px;border-left:0;border-top:0}
.pframe .cap{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font:500 10px var(--mono);letter-spacing:.24em;color:var(--lab)}
.pair{display:flex;gap:22px;justify-content:center;align-items:flex-start;margin:14px 0 6px;width:100%}
.pair .pframe{width:min(38vw,150px);margin:0}
.pair .pframe+.pframe{margin-top:30px}
/* study timeline */
.tl{width:100%;position:relative;margin:8px 0 6px;opacity:0;transition:opacity 1.2s}
.tl.in{opacity:1}
.tl-track{position:absolute;left:6px;right:6px;top:5px;height:2px;background:var(--line)}
.tl-track i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--e),var(--b));box-shadow:0 0 10px var(--b);transition:width 3.2s linear}
.tl-pts{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr}
.tp{display:flex;flex-direction:column;gap:6px}
.tp:nth-child(1){align-items:flex-start;text-align:left}.tp:nth-child(2){align-items:center;text-align:center}.tp:nth-child(3){align-items:flex-end;text-align:right}
.tp b{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--navy);transition:all .8s}
.tp.on b{background:var(--b);border-color:var(--b);box-shadow:0 0 14px var(--b)}
.tp span{font:700 17px var(--disp);letter-spacing:.04em}
.tp small{font:500 9.5px var(--mono);letter-spacing:.2em;color:var(--lab)}
@media (min-width:700px){#flow{padding-left:40px;padding-right:40px}}
@media (max-height:620px){#flow{padding-top:calc(env(safe-area-inset-top) + 92px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.25s!important}
  .ln{filter:none;transform:none}
  .scanh,.scanx{display:none}
}
</style>
</head>

<script>
/* =====================================================
   ⚙️ CONFIG — EDIT HERE
   ===================================================== */
const CONFIG = {
  waNumber: "255613616291",            // Maher's WhatsApp (Tanzania international format, no + sign). Never shown on screen.
  songUrl:   "https://www.youtube.com/watch?v=MqHhcls_nuM",   // OFFICIAL external link only. The audio is NOT downloaded or bundled. Set "" to hide the song button.
  songTitle: "Zuchu — I Love You (Official Music Video)",
  prefix:   "Hey Maher, I just finished the transmission... 🤍",
  maxChars: 800
};

/* 📷 PHOTOS — the two photos are EMBEDDED at the bottom of this file, so index.html works on its own.
   To use your own files instead: set USE_EMBEDDED_PHOTOS = false and replace assets/images/maher.jpg and salha.jpg. */
const USE_EMBEDDED_PHOTOS = true;
const PHOTO_FILES = { maher:"assets/images/maher.jpg", salha:"assets/images/salha.jpg" };
const photo = w => (USE_EMBEDDED_PHOTOS && window.EMBEDDED_PHOTOS && window.EMBEDDED_PHOTOS[w]) || PHOTO_FILES[w];

/* =====================================================
   📖 CONTENT
   B = big line · M = medium line · S = small line · X = mono system label · P = pause · {k:"gap"} spacing
   Add {cls:"accent"} for electric-blue text.
   ===================================================== */
const B=(t,o)=>({k:"l",c:"big",t,...o}), M=(t,o)=>({k:"l",c:"mid",t,...o}), S=(t,o)=>({k:"l",c:"sm",t,...o}),
      X=(t,o)=>({k:"l",c:"mono",t,...o}), H=(t,o)=>({k:"l",c:"huge",t,...o}), P=ms=>({k:"p",ms}), G={k:"gap"};

const PAGES=[
 /* ---- MAIN INTERFACE ---- */
 {type:"hub",n:1,theme:"dark",orb:"hub"},

 /* ---- TRANSMISSION 01 ---- */
 {n:1,theme:"dark",orb:"bg",enter:"scan",items:[
   X("TRANSMISSION 01"),X("SUBJECT: SOMETHING CHANGED"),G,
   B("You might notice me becoming quieter."),P(900),
   M("Less texting."),P(700),M("Shorter conversations."),P(700),M("Sometimes... nothing.")]},
 {n:1,theme:"dark",orb:"bg",items:[
   S("Before your mind starts creating its own explanation..."),P(1300),B("let me explain.",{cls:"accent"})]},

 /* ---- TRANSMISSION 02 — LOCK IN ---- */
 {n:2,theme:"dark",orb:"bg",vert:true,items:[
   X("TRANSMISSION 02"),G,H("LOCK IN."),P(900),M("There's something I need to give more of myself to right now.")]},
 {n:2,theme:"dark",orb:"bg",vert:true,items:[
   {k:"labels"},M("My studies."),P(700),M("My future."),P(700),M("The things I'm trying to build.")]},
 {n:2,theme:"dark",orb:"bg",vert:true,items:[
   X("STUDY PLAN // HOLIDAY MODE"),G,
   M("This holiday, I want to study really hard."),P(900),
   M("From now until December."),P(1000),
   S("Because next year I have a lot of exams..."),P(900),
   M("all the way until May,"),B("when I sit for NECTA.",{cls:"accent"}),G,{k:"timeline"}]},
 {n:2,theme:"dark",orb:"bg",vert:true,items:[
   M("I don't want temporary distractions to decide my future for me."),P(1100),B("So I'm choosing to lock in.",{cls:"accent"})]},
 /* reassurance (minimal) */
 {n:2,theme:"min",orb:"off",items:[
   {k:"hline"},B("But don't confuse less access with less care."),P(1200),
   M("If I reply late..."),M("If I disappear for a while..."),M("If our conversations become shorter..."),P(1100),
   B("please don't automatically think my feelings changed."),G,X("SYSTEM NOTE // DO NOT MISINTERPRET SILENCE")]},

 /* ---- TRANSMISSION 03 — HONESTY ---- */
 {n:3,theme:"black",orb:"off",enter:"center",items:[
   X("TRANSMISSION 03"),X("CLASSIFICATION: HONESTY"),G,
   M("There's something else I don't want to hide from you."),P(1400),{k:"scanx"},P(900),
   B("Me and Naymah are partners.")]},
 {n:3,theme:"black",orb:"off",items:[
   M("I know that sentence can bring questions."),P(900),
   M("And I'm not telling you because I expect you to instantly understand everything.")]},
 {n:3,theme:"black",orb:"off",items:[
   M("I'm telling you because I could have hidden it."),P(1500),B("But I chose not to.",{cls:"accent"})]},
 {n:3,theme:"dark",orb:"bg",items:[
   {k:"split"},P(600),M("You deserve to know the real version of me."),P(900),
   S("Not a carefully edited version designed to make everything look perfect.")]},
 {n:3,theme:"dark",orb:"bg",items:[
   M("Being honest about Naymah doesn't erase what I feel for you."),P(1100),
   M("And caring about you doesn't mean pretending other parts of my life don't exist."),G,
   X("SYSTEM NOTE // HOW YOU FEEL ABOUT THIS IS YOURS")]},

 /* ---- TRANSMISSION 04 — SALHA ---- */
 {n:4,theme:"glow",orb:"off",enter:"glow",align:"center",items:[
   {k:"photo",who:"salha",cap:["SALHA","RECIPIENT"],pos:"50% 22%"},H("SALHA"),P(900),M("And then there's you."),P(1100),M("Yeah... you.",{cls:"accent"})]},
 {n:4,theme:"glow",orb:"off",align:"center",items:[
   M("If I become quieter, please don't immediately translate that into \"Maher doesn't care anymore.\""),P(1100),
   M("Sometimes Maher is simply fighting with books 😂"),G,X("CURRENT MISSION: SURVIVE FORM 6"),G,
   M("I'm trying to build something for my future.")]},
 {n:4,theme:"glow",orb:"off",align:"center",items:[
   B("I still want the random conversations."),P(1000),
   S("The jokes."),S("The stupid little moments."),S("The times you randomly appear and disturb my concentration 😂"),P(1200),
   M("I just can't give them the same amount of time right now."),P(900),M("And I hope you can understand why.",{cls:"accent"})]},

 /* ---- TRANSMISSION 05 — FINAL MESSAGE ---- */
 {n:5,theme:"dark",orb:"bg",enter:"tech",items:[
   X("TRANSMISSION 05"),X("FINAL MESSAGE"),G,{k:"progress"},
   M("So if you see less of Maher..."),P(1100),B("don't assume you've lost Maher.")]},
 {n:5,theme:"dark",orb:"bg",items:[
   {k:"photo",who:"maher",cap:["MAHER","BUILD MODE"],pos:"72% 30%"},
   M("You might simply be seeing the version of him that's trying really hard to build his next chapter."),P(1400),
   M("And when I come back..."),P(900),B("I want to come back better.",{cls:"accent"})]},

 /* ---- FINAL ---- */
 {n:5,theme:"final",orb:"off",enter:"point",align:"center",items:[
   {k:"point"},P(2200),B("FOR SALHA."),P(1300),
   M("No perfect explanation."),M("No hidden version."),M("Just honesty."),P(1300),
   M("Study mode: ON 📚"),P(1500),M("Maher mode: unfortunately still active 😂"),P(1600),
   M("Take care of yourself, Salha."),{k:"pair"},G,X("END OF TRANSMISSION"),X("MR//S")]},

 /* ---- TRANSMISSION 06 — REPLY CHANNEL ---- */
 {type:"reply",n:6,theme:"dark",orb:"bg",enter:"expand",noHint:true,items:[
   X("TRANSMISSION 06"),X("REPLY CHANNEL"),G,H("YOUR TURN."),P(900),
   M("Okay Salha... I've said my part."),M("Now I want to hear yours."),P(900),{k:"reply"}]}
];

/* =====================================================
   ENGINE
   ===================================================== */
const $=s=>document.querySelector(s);
const flow=$("#flow"), stage=$("#stage"), hint=$("#hint"), fxl=$("#fxlayer"), body=document.body;
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const BG={dark:"a",reply:"a",min:"d",black:"b",glow:"c",final:"e"};
let idx=-1, started=false, busy=false, ready=false, readyAt=0, skip=false, tok=0, stick=true, userScroll=false, running=false;
const waiters=new Set();
const wait=ms=>new Promise(res=>{
  if(skip||ms<=0) return res();
  const done=()=>{clearTimeout(t);waiters.delete(done);res()};
  const t=setTimeout(done,RM?ms*.6:ms); waiters.add(done);
});
const plain=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,200):ms));
const fastForward=()=>{ skip=true; [...waiters].forEach(f=>f()); };
const mk=(tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;};
const pad=n=>String(n).padStart(3,"0");

/* chapter groups for progress */
(function(){ const g={}; PAGES.forEach(p=>{(g[p.n]=g[p.n]||[]).push(p)}); PAGES.forEach(p=>{p.pos=g[p.n].indexOf(p);p.cnt=g[p.n].length}); })();

/* build the orb's outer tick marks */
(function(){ const g=$("#ticks"); let h=""; for(let a=0;a<360;a+=6){ const long=a%30===0, r1=184, r2=long?170:177, rad=a*Math.PI/180;
  h+=`<line x1="${200+r1*Math.cos(rad)}" y1="${200+r1*Math.sin(rad)}" x2="${200+r2*Math.cos(rad)}" y2="${200+r2*Math.sin(rad)}" stroke="#2F8CFF" stroke-opacity="${long?.8:.4}" stroke-width="1"/>`; }
  g.insertAdjacentHTML("beforeend",h); })();

/* scroll-follow (only if the reader hasn't scrolled away) */
stage.addEventListener("touchstart",()=>{userScroll=true},{passive:true});
stage.addEventListener("touchend",()=>setTimeout(()=>{userScroll=false},900),{passive:true});
stage.addEventListener("wheel",()=>{userScroll=true;clearTimeout(stage._w);stage._w=setTimeout(()=>userScroll=false,900)},{passive:true});
stage.addEventListener("scroll",()=>{ if(userScroll) stick=(stage.scrollHeight-stage.scrollTop-stage.clientHeight)<160; },{passive:true});
const follow=()=>{ if(stick) stage.scrollTo({top:stage.scrollHeight,behavior:RM?"auto":"smooth"}); };

/* =====================================================
   ITEM RENDERERS
   ===================================================== */
function addLine(it){
  const d=mk("div","ln "+it.c+(it.cls?" "+it.cls:"")); d.textContent=it.t;
  if(it.c!=="mono") flow.querySelectorAll(".ln.big,.ln.mid,.ln.sm,.ln.huge").forEach(e=>e.classList.add("past"));
  flow.appendChild(d); follow();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ d.classList.add("in"); if(skip) d.classList.add("now"); }));
  if(it.w!=null) return wait(it.w);
  if(it.c==="mono") return wait(650);
  return wait(Math.min(5200,(it.c==="huge"?1200:1300)+it.t.length*46));
}
async function renderItem(it){
  switch(it.k){
    case "l": return addLine(it);
    case "p": return wait(it.ms);
    case "gap": flow.appendChild(mk("div","gap")); return wait(150);
    case "hline": { const h=mk("div","hline"); flow.appendChild(h); await wait(200); h.classList.add("in"); return wait(1500); }
    case "scanx": { const s=mk("div","scanx"); fxl.appendChild(s); setTimeout(()=>s.remove(),2000); return wait(1700); }
    case "labels": {
      const spots=[["STUDY","top:21%;left:7%"],["FUTURE","top:19%;right:7%"],["GOALS","bottom:27%;left:8%"],["BUILD","bottom:25%;right:7%"]];
      for(const [t,pos] of spots){ const l=mk("div","flabel",t); l.style.cssText=pos; fxl.appendChild(l); requestAnimationFrame(()=>requestAnimationFrame(()=>l.classList.add("in"))); await wait(700); }
      return;
    }
    case "split": {
      const s=mk("div","split",'<div class="sc l"><small>WHAT I COULD HAVE DONE</small><b>Hide it.</b></div><div class="vl"></div><div class="sc r"><small>WHAT I CHOSE</small><b>Tell you.</b></div>');
      flow.appendChild(s); follow(); await wait(500);
      s.querySelector(".l").classList.add("in"); await wait(2200);
      s.querySelector(".vl").classList.add("in"); await wait(900);
      s.querySelector(".r").classList.add("in"); return wait(2600);
    }
    case "progress": {
      const p=mk("div","prog",'<div class="ln mono" style="opacity:1;filter:none;transform:none;margin:0">BUILDING THE NEXT CHAPTER</div><div class="bar2"><i></i></div><div class="pct">0%</div>');
      flow.appendChild(p); await wait(100); p.classList.add("in");
      const fill=p.querySelector("i"), pct=p.querySelector(".pct"), dur=RM?1500:4800, t0=performance.now();
      await new Promise(res=>{ const step=now=>{ const k=skip?1:Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,2.2); fill.style.width=(e*100)+"%"; pct.textContent=Math.round(e*100)+"%"; if(k<1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
      fill.style.width="100%"; pct.textContent="100%"; return wait(1100);
    }
    case "point": {
      const w=mk("div","pointwrap",'<button class="point" type="button" aria-label="A small blue point"></button>'); flow.appendChild(w); wireSecret2(w.querySelector(".point")); return wait(600);
    }
    case "photo": {
      const f=mk("div","pframe",'<div class="img"></div><div class="cap"><span>'+it.cap[0]+'</span><span>'+it.cap[1]+'</span></div>');
      const im=f.querySelector(".img"); im.style.backgroundImage='url("'+photo(it.who)+'")'; if(it.pos) f.style.setProperty("--pos",it.pos);
      flow.appendChild(f); follow(); await wait(200); f.classList.add("in"); return wait(2200);
    }
    case "pair": {
      const w=mk("div","pair"); flow.appendChild(w); follow();
      const defs=[["maher","MAHER","MR//S","72% 30%"],["salha","SALHA","MR//S","50% 22%"]];
      for(const d of defs){ const f=mk("div","pframe",'<div class="img"></div><div class="cap"><span>'+d[1]+'</span><span>'+d[2]+'</span></div>');
        f.querySelector(".img").style.backgroundImage='url("'+photo(d[0])+'")'; f.style.setProperty("--pos",d[3]); w.appendChild(f);
        await wait(200); f.classList.add("in"); await wait(1500); }
      return wait(1200);
    }
    case "timeline": {
      const t=mk("div","tl",'<div class="tl-track"><i></i></div><div class="tl-pts"><div class="tp"><b></b><span>NOW</span><small>LOCK IN</small></div><div class="tp"><b></b><span>DEC</span><small>HOLIDAY STUDY</small></div><div class="tp"><b></b><span>MAY</span><small>NECTA</small></div></div>');
      flow.appendChild(t); follow(); await wait(300); t.classList.add("in");
      const pts=t.querySelectorAll(".tp"); pts[0].classList.add("on"); await wait(500);
      t.querySelector("i").style.width="100%"; await wait(1600); pts[1].classList.add("on"); await wait(1600); pts[2].classList.add("on");
      return wait(1600);
    }
    case "reply": return buildReply();
  }
}

/* =====================================================
   REPLY CHANNEL (WhatsApp click-to-chat — nothing is stored or sent anywhere else)
   ===================================================== */
function buildReply(){
  const pan=mk("section","panel",
   '<div class="prow"><span>CHANNEL: MAHER</span><span id="pst">STATUS: WAITING FOR RESPONSE<i class="cur"></i></span></div>'+
   '<div class="tawrap"><textarea id="ta" rows="5" maxlength="'+CONFIG.maxChars+'" placeholder="Type whatever you want to tell Maher..." aria-label="Your message to Maher"></textarea></div>'+
   '<div class="crow"><span id="warn" role="alert"></span><span id="cnt">0 / '+CONFIG.maxChars+'</span></div>'+

/* =====================================================
   NAVIGATION & TRANSITIONS
   ===================================================== */
function updateHud(i){
  const p=PAGES[i], segs=[...document.querySelectorAll("#seg i")];
  const frac=(p.n-1+(p.pos+1)/p.cnt)/6;
  segs.forEach((s,k)=>s.style.setProperty("--f",Math.max(0,Math.min(1,frac*6-k))));
  $("#count").textContent="0"+p.n+" / 06";
  $("#sig").textContent="MR//S_"+pad(i+1);
  $("#coord").textContent="X "+String(412+i*37).padStart(4,"0")+" · Y "+String(186+i*53).padStart(4,"0");
}
function applyTheme(p){
  body.dataset.th=p.theme; body.dataset.bg=BG[p.theme]; body.dataset.orb=p.orb||"bg";
}
async function goTo(i){
  if(busy||i>=PAGES.length) return; busy=true; running=false; tok++;
  const p=PAGES[i], first=!PAGES[i-1]||PAGES[i-1].n!==p.n||p.enter;
  hint.classList.remove("show","pulse"); ready=false;
  if(idx>=0){ stage.classList.add("out"); await plain(560); }
  fxl.innerHTML=""; flow.innerHTML=""; stage.scrollTop=0; stick=true;
  flow.className="text"+(p.align?" "+p.align:"")+(p.vert?" vert":"");
  applyTheme(p); updateHud(i); idx=i;
  if(p.enter==="point") await plain(1200);          // everything fades into one blue point
  if(p.enter==="center") await plain(700);          // darkness before the central reveal
  if(p.enter==="scan"){ fxl.appendChild(mk("div","scanh")); }
  body.dataset.enter=p.enter||"";
  stage.classList.remove("out");
  setTimeout(()=>{ if(PAGES[idx]===p) body.dataset.enter=""; },3300);
  busy=false;
  play(p);
}
async function play(p){
  const my=++tok; running=true; skip=false;
  await plain(p.enter==="glow"?1400:p.enter==="center"?900:500);
  if(p.type==="hub"){ await wait(1800); }
  else { for(const it of p.items){ if(my!==tok) return; await renderItem(it); } }
  if(my!==tok) return;
  running=false; skip=false; ready=true; readyAt=performance.now();
  if(!p.noHint){ setTimeout(()=>{ if(my===tok){ hint.classList.add("show","pulse"); } },1400); }
}
function advance(){
  if(!started||busy) return;
  const p=PAGES[idx]; if(!p) return;
  if(!ready){ if(running) fastForward(); return; }        // tap while text is appearing = show the rest instantly
  if(performance.now()-readyAt<900||p.noHint) return;      // never skip past text by accident
  goTo(idx+1);
}

/* input: tap, swipe, keyboard */
$("#app").addEventListener("click",e=>{ if(e.target.closest("button,a,textarea,input,#music,#pop,.pointwrap")) return; advance(); });
hint.addEventListener("click",advance);
let tx=0,ty=0;
document.addEventListener("touchstart",e=>{ const t=e.touches[0]; tx=t.clientX; ty=t.clientY; },{passive:true});
document.addEventListener("touchend",e=>{
  if(!started||e.target.closest("textarea,input")) return;
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  const canScroll=stage.scrollHeight>stage.clientHeight+6, atEnd=(stage.scrollHeight-stage.scrollTop-stage.clientHeight)<12;
  if(dx<-70&&Math.abs(dx)>Math.abs(dy)*1.6) advance();
  else if(dy<-80&&Math.abs(dy)>Math.abs(dx)*1.6&&(!canScroll||atEnd)) advance();
},{passive:true});
document.addEventListener("keydown",e=>{
  if(!started||e.target.closest("textarea,input")) return;
  if(["ArrowRight","ArrowDown","PageDown"].includes(e.key)||((e.key===" "||e.key==="Enter")&&!e.target.closest("button,a"))){ e.preventDefault(); advance(); }
});

/* =====================================================
   SONG — official YouTube embedded player (nothing is downloaded or bundled).
   Starts when "[ OPEN ]" is tapped and keeps playing while the pages move.
   If the embed is blocked (e.g. opened as a local file), it falls back to the official link.
   ===================================================== */
window.startMusic=()=>{};
(function(){
  const music=$("#music");
  if(!CONFIG.songUrl){ music.remove(); return; }
  let id=""; try{ id=new URL(CONFIG.songUrl).searchParams.get("v")||""; }catch(e){}
  $("#mlink").href=CONFIG.songUrl; $("#mtitle").textContent=CONFIG.songTitle;
  const btn=$("#mbtn"), play=$("#mplay"), mute=$("#mmute"), vol=$("#mvol");
  let yt=null, ready=false, want=false, playing=false, muted=false, level=55, fadeIv;
  const ui=()=>{ music.classList.toggle("playing",playing); play.textContent=playing?"PAUSE":"PLAY"; mute.textContent=muted?"UNMUTE":"MUTE"; };
  const openP=o=>{ music.classList.toggle("open",o); btn.setAttribute("aria-expanded",o); };
  btn.addEventListener("click",()=>openP(!music.classList.contains("open")));
  const fail=()=>{ music.classList.add("linkonly"); playing=false; ui(); };
  function fade(to,ms){ if(!yt) return; clearInterval(fadeIv); const v=yt.getVolume(),n=20; let i=0; fadeIv=setInterval(()=>{ i++; yt.setVolume(Math.round(v+(to-v)*i/n)); if(i>=n) clearInterval(fadeIv); },ms/n); }
  function kick(){ try{ yt.setVolume(0); yt.playVideo(); setTimeout(()=>{ if(!muted) fade(level,2500); },700); }catch(e){} }
  if(id){
    const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; s.onerror=fail; document.head.appendChild(s);
    window.onYouTubeIframeAPIReady=()=>{
      const vars={playsinline:1,controls:0,rel:0,modestbranding:1,loop:1,playlist:id,disablekb:1,fs:0};
      if(/^https?:/.test(location.protocol)) vars.origin=location.origin;
      yt=new YT.Player("ytp",{width:240,height:135,videoId:id,playerVars:vars,events:{
        onReady:()=>{ ready=true; yt.setVolume(0); if(want) kick(); },
        onStateChange:e=>{ playing=e.data===1; if(e.data===0) yt.playVideo(); ui(); },
        onError:fail }});
    };
  } else fail();
  window.startMusic=()=>{ want=true; openP(true); setTimeout(()=>openP(false),6500); if(ready) kick(); };
  play.addEventListener("click",()=>{ if(!ready) return; if(playing) yt.pauseVideo(); else { yt.playVideo(); if(!muted) fade(level,1200); } });
  mute.addEventListener("click",()=>{ if(!ready) return; muted=!muted; muted?yt.mute():yt.unMute(); ui(); });
  vol.addEventListener("input",e=>{ level=+e.target.value; if(ready&&!muted){ clearInterval(fadeIv); yt.setVolume(level); } });
  ui();
})();

/* =====================================================
   PARTICLES (very light)
   ===================================================== */
(function(){
  if(RM) return;
  const cv=$("#fx"), cx=cv.getContext("2d"); let W,H,D,pts=[];
  const rs=()=>{ D=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*D; cv.height=H*D; cx.setTransform(D,0,0,D,0,0); };
  addEventListener("resize",rs); rs();
  for(let i=0;i<30;i++) pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.4,vx:(Math.random()-.5)*.12,vy:-Math.random()*.25-.04,a:Math.random()*.5+.15,t:Math.random()*6});
  let last=0;
  (function loop(ts){
    requestAnimationFrame(loop);
    if(document.hidden||ts-last<33) return; last=ts;
    cx.clearRect(0,0,W,H);
    const light=body.dataset.th==="glow";
    pts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.t+=.02; if(p.y<-8){p.y=H+8;p.x=Math.random()*W} if(p.x<-8)p.x=W+8; if(p.x>W+8)p.x=-8;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fillStyle=(light?"rgba(23,107,255,":"rgba(120,175,255,")+(p.a*(.6+.4*Math.sin(p.t)))+")"; cx.fill(); });
  })(0);
})();

boot();
